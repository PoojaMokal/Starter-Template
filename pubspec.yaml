name: base_project
description: "Flutter base project — Clean Architecture + BLoC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (BLoC is dominant; Riverpod only provides the root ProviderScope)
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  logger: ^2.8.0
  talker_dio_logger: ^5.1.20

  # Functional error handling
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Navigation
  go_router: ^17.5.0

  # Storage
  flutter_secure_storage: ^11.2.0

  # Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.7

  # Device / connectivity
  internet_connection_checker_plus: ^3.1.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_udid: ^4.1.6
  safe_device: ^1.4.1

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  lottie: ^3.6.1
  intl: ^0.20.3

  # Firebase
  firebase_core: ^5.0.0
  firebase_remote_config: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_crashlytics: ^6.0.0

  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.3.2
  injectable_generator: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_assets: ^0.0.6
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/background/
    - assets/images/logos/
    - assets/images/icons/
    - assets/images/placeholder/
    - assets/lottie/

  # TODO: drop the .ttf files into assets/fonts/<Family>/ and uncomment.
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto/Roboto-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter/Inter-Bold.ttf
  #         weight: 700

# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  # TODO: image: assets/images/logos/app_logo.png
  android_12:
    color: "#FFFFFF"

